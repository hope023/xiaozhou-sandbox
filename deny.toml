# cargo-deny 配置：把「不许引入 copyleft」变成 CI 门禁，而不是一句口头约定。
#
# 本地运行：
#   cargo install cargo-deny --locked
#   cargo deny --manifest-path src-tauri/Cargo.toml check licenses

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
# 只允许「可闭源商用」的许可证。GPL / AGPL / LGPL / SSPL 一律拒绝。
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
# ring / webpki 等双许可包按声明选择其中之一
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 下面这些一旦出现就说明有人把 GPL 组件引进来了
deny = [
  { name = "rime-ice", reason = "GPL-3.0-only，会传染整个产品" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
